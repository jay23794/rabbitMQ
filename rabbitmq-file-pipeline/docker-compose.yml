# Infrastructure only — Node services run locally on the host, not in Docker.
# MongoDB is not included here; run it outside Docker (local install or Atlas).
# Start:  docker compose up -d
# Stop:   docker compose down        (add -v to also wipe data volumes)

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      # 5672 = AMQP protocol port. Node producers/consumers connect here,
      # e.g. amqp://guest:guest@localhost:5672
      - "5672:5672"
      # 15672 = Management UI + HTTP API. Open http://localhost:15672
      # in a browser (login guest / guest) to inspect queues, exchanges, messages.
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
